services:
  postgres:
    image: postgres:16-alpine
    container_name: cybersim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybersim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: cybersim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Скрипты инициализации выполняются при первом запуске
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersim -d cybersim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybersim-net

  llm:
    image: ollama/ollama:latest
    container_name: cybersim-llm
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - llm_ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cybersim-net

  # One-shot: скачивает LLM Qwen3 8B (Q4_K_M), затем завершается.
  llm-init:
    image: ollama/ollama:latest
    container_name: cybersim-llm-init
    restart: "no"
    depends_on:
      llm:
        condition: service_started
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull qwen3:8b-q4_K_M
    volumes:
      - llm_ollama_data:/root/.ollama
    networks:
      - cybersim-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersim-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cybersim:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cybersim
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen3:8b-q4_K_M
      LLM_BASE_URL: http://llm:11434
      LLM_TEMPERATURE: 0.7
      LLM_NUM_CTX: 8192
      LLM_TIMEOUT: 120
      STORAGE_DIR: /app/data/uploads
      QUARANTINE_DIR: /app/data/quarantine
      MIN_DOCUMENT_CHARS: 100
      MIN_DOCUMENT_CHUNKS: 1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/data/uploads
      - quarantine_data:/app/data/quarantine
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
      llm-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cybersim-net

volumes:
  postgres_data:
  llm_ollama_data:
  uploads_data:
  quarantine_data:

networks:
  cybersim-net:
    driver: bridge