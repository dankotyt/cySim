services:
  postgres:
    image: postgres:16-alpine
    container_name: cybersim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybersim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: cybersim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersim -d cybersim"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cybersim-net

  llm:
    image: ollama/ollama:latest
    container_name: cybersim-llm
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - llm_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=10m # Держим модель в памяти 10 минут после запроса
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cybersim-net

  # One-shot: скачивает LLM (запускается один раз и завершается)
  llm-init:
    image: ollama/ollama:latest
    container_name: cybersim-llm-init
    restart: "no"
    depends_on:
      llm:
        condition: service_started
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull qwen3:8b-q4_K_M
    networks:
      - cybersim-net

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: cybersim-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cybersim:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cybersim
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen3:8b-q4_K_M
      # ИСПРАВЛЕНО: обращаемся к сервису llm, порт внутри сети 11434
      LLM_BASE_URL: http://llm:11434
      LLM_TEMPERATURE: 0.7
      LLM_NUM_CTX: 8192
      LLM_TIMEOUT: 300 # Увеличил таймаут до 5 минут, т.к. локальный инференс медленный
      # LoRA rule extraction
      LORA_BASE_MODEL_PATH: /llms/base/Qwen2.5-7B-Instruct
      LORA_ADAPTER_PATH: /llms/adapters/qwen2.5-7b-instruct-secpol-lora
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./llms:/llms
    # Выделяем оперативку для PyTorch (иначе упадет с bus error)
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
      llm-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cybersim-net

volumes:
  postgres_data:
  llm_ollama_data:

networks:
  cybersim-net:
    driver: bridge